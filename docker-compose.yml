services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Pr1yanka@123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Pr1yanka@123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: backend-app
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: sa
      DB_PASSWORD: "Pr1yanka@123"
      DB_SERVER: sqlserver
      DB_DATABASE: priyanka
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend-app
    ports:
      - "3000:3000"
    depends_on:
      - backend